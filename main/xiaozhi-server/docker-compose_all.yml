# Docker安装全模块

version: '3'
services:
  # Server模块
  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
    restart: always
    networks:
      - default
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于视觉分析接口
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置文件目录
      - ./data:/opt/xiaozhi-esp32-server/data
      # 模型文件挂接，很重要
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt

  # manager-api和manager-web模块
  xiaozhi-esp32-server-web:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # 智控台
      - "8002:8002"
      # 2.3.13 开发固件的兼容 OTA 入口，与 8002 指向同一 manager
      - "18002:8002"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      # 配置文件目录
      - ./uploadfile:/uploadfile
  # 数据库模块
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # redis模块
  xiaozhi-esp32-server-redis:
    image: redis:8.0
    expose:
      - 6379
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # 开发/测试角色包：公共包与预览图
  role-assets:
    image: python:3.10-slim
    container_name: xiaozhi-role-assets
    restart: always
    command: ["python", "/srv/serve_role_files.py"]
    environment:
      - ROLE_FILE_SET=public-assets
    ports:
      - "18082:8080"
    volumes:
      - ${ESP_ROLE_ROOT:-/home/luban/codebase/aiot/esp32-nezuko}/.tools/role-packs-public:/roles:ro
      - ./serve_role_files.py:/srv/serve_role_files.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/cheese_cat-2026.08.17.1.bin', method='HEAD'), timeout=2); assert response.status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3

  role-avatars:
    image: python:3.10-slim
    container_name: xiaozhi-role-avatars
    restart: always
    command: ["python", "/srv/serve_role_files.py"]
    environment:
      - ROLE_FILE_SET=public-avatars
    ports:
      - "18083:8080"
    volumes:
      - ${ESP_ROLE_ROOT:-/home/luban/codebase/aiot/esp32-nezuko}/main/assets/characters/source/original:/avatars:ro
      - ./serve_role_files.py:/srv/serve_role_files.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/cheese_cat_idle.png', method='HEAD'), timeout=2); assert response.status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 内部原型不进入公共 catalog，只暴露精确白名单路径
  role-internal-assets:
    image: python:3.10-slim
    container_name: xiaozhi-role-internal-assets
    restart: always
    command: ["python", "/srv/serve_role_files.py"]
    environment:
      - ROLE_FILE_SET=internal
    ports:
      - "18084:8080"
    volumes:
      - ${ESP_ROLE_ROOT:-/home/luban/codebase/aiot/esp32-nezuko}/.tools/role-packs-internal:/roles:ro
      - ${ESP_ROLE_ROOT:-/home/luban/codebase/aiot/esp32-nezuko}/main/assets/characters/private:/avatars:ro
      - ./serve_role_files.py:/srv/serve_role_files.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/nezuko_proto-2026.08.17.1.bin', method='HEAD'), timeout=2); assert response.status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  default:
