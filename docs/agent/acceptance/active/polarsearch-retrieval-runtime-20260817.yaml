schema_version: 1
goal_id: polarsearch-retrieval-runtime-20260817
goal: 基于 cyjdata-index 现有 PolarSearch 检索能力交付可供小智调用的 Retrieval Runtime，先本机验收再部署 ACK 非生产环境
status: in_progress
authority:
  user_mandate: 端口已经部署；通过 kubectl 查看 cyjdata-index 生产配置；Harness 采用推荐方案，先本机后 ACK
  autonomy_profile: nonprod-auto
  coordinator_workspace: /home/luban/codebase/aiot/xiaozhi-esp32-server
  writer_workspaces:
    - /home/luban/codebase/aiot/xiaozhi-esp32-server
  branches:
    - codex/polarsearch-retrieval-runtime
scope:
  in:
    - 只读复核 cyjdata-index 生产检索契约、网络可达性和权限边界，不复制 PolarSearch 或数据库凭据
    - 实现 provider-neutral 的 Retrieval Runtime，通过 cyjdata-v2 HTTPS API 查询产品与公开知识
    - 为 xiaozhi-server 增加受控检索工具适配，采用短超时、TLS 校验、连接复用、结果限量和安全降级
    - 在本机完成单元、契约和容器 smoke 后部署 ACK 非生产环境并验证
  out:
    - 写入或变更 cyjdata-index 生产工作负载、数据库、索引、密钥和权限
    - 绕过受限知识 entitlement 签名或把生产 API Key 写入 Git、镜像、日志和验收文档
    - 将尚未导入的知识语料伪装成可用，或在本任务中修改家庭路由器和运营商网络
required_environments:
  - local
  - ack-nonprod
stop_conditions:
  - 继续执行需要修改 cyjdata-index 生产资源、轮换密钥、降低受限知识权限或执行不可回滚数据迁移
  - 检测到其他 writer 修改同一工作区，或用户拥有的 rolepic 未跟踪素材与任务改动发生冲突
criteria:
  - id: AC-01
    outcome: 生产检索契约以只读方式复核，产品查询成功，知识索引未就绪被明确报告且任何凭据均未进入仓库或输出
    verifier:
      type: command
      command: cd /home/luban/codebase/aiot/xiaozhi-esp32-server && bash scripts/verify-retrieval-production-contract.sh
    environment: local
    required: true
    owner: agent
    evidence:
      - Read-only kubectl contract verifier confirmed cyjdata-v2-api available and required PolarSearch ConfigMaps present
      - Bounded production query returned 3 non-degraded product results; public knowledge returned contractVersion 1 with zero items and degraded=true
      - The production API key was held only in process memory and checked absent from every tracked repository file
    status: pass
    last_verified_at: 2026-08-17T20:24:20+08:00
  - id: AC-02
    outcome: Retrieval Runtime 对产品和公开知识提供稳定契约，拒绝未签名受限知识，并对超时、鉴权失败和上游降级安全失败
    verifier:
      type: command
      command: cd /home/luban/codebase/aiot/xiaozhi-esp32-server && PYTHONPATH=main/retrieval-runtime uv run --with-requirements main/retrieval-runtime/requirements.txt python -m unittest discover -s main/retrieval-runtime/tests -p 'test_*.py'
    environment: local
    required: true
    owner: agent
    evidence:
      - 6 Runtime contract tests pass, covering product normalization, partial knowledge degradation, cache reuse, auth failure redaction, restricted scope rejection and unsafe reason filtering
      - Ruff format/check and git diff --check pass for the Runtime and plugin code
    status: pass
    last_verified_at: 2026-08-17T20:24:20+08:00
  - id: AC-03
    outcome: xiaozhi-server 检索工具可调用本机 Harness，返回有限且可引用的上下文，上游不可用时不泄露异常和响应正文
    verifier:
      type: command
      command: cd /home/luban/codebase/aiot/xiaozhi-esp32-server && docker run --rm --network none -v "$PWD/main/xiaozhi-server:/opt/xiaozhi-esp32-server" -v "$PWD/tests/fixtures/isolated-config.yaml:/opt/xiaozhi-esp32-server/data/.config.yaml:ro" -w /opt/xiaozhi-esp32-server --entrypoint python xiaozhi-server:0.9.6-latency-ca95dfad -m unittest tests.test_retrieval_runtime_plugin tests.test_sensitive_log_redaction && bash scripts/verify-retrieval-manager-migration.sh
    environment: local
    required: true
    owner: agent
    evidence:
      - 10 isolated server tests pass with network disabled; includes bounded grounded context, generic timeout fallback, trusted-host validation and connection cleanup
      - Disposable MySQL 9.6 validation proves the Plugin provider migration is idempotent, rollback-safe and contains no API-key field
      - Full manager unit run reached 136 passing tests; 5 pre-existing Spring context tests require a local MySQL listener and failed only because 127.0.0.1:3306 was absent, so the disposable migration verifier is the authoritative database evidence
    status: pass
    last_verified_at: 2026-08-17T20:24:20+08:00
  - id: AC-04
    outcome: 本机容器化 Harness 健康，能通过 cyjdata-v2 生产只读 API 完成一次有界产品检索，且未发布公网端口
    verifier:
      type: command
      command: cd /home/luban/codebase/aiot/xiaozhi-esp32-server && bash scripts/verify-retrieval-runtime-local.sh
    environment: local
    required: true
    owner: agent
    evidence:
      - Hardened read-only container started healthy with the API key mounted from a temporary mode-0600 file and no published host port
      - Final real product-plus-public-knowledge request returned 4 normalized items in 718 ms; answerable=true and degraded=true only because the knowledge corpus is not populated
      - Container ran without root capabilities, with read-only root filesystem, no-new-privileges and a bounded tmpfs
    status: pass
    last_verified_at: 2026-08-17T20:24:20+08:00
  - id: AC-05
    outcome: 同一镜像和配置契约部署到 ACK 非生产环境，健康检查和内部产品检索 smoke 通过，生产资源保持只读
    verifier:
      type: command
      command: cd /home/luban/codebase/aiot/xiaozhi-esp32-server && bash scripts/verify-retrieval-runtime-ack.sh
    environment: ack-nonprod
    required: true
    owner: agent
    evidence: []
    status: pending
    last_verified_at: null
completion:
  required_status: pass
  allow_not_applicable: true
