  - id: AC-02
    outcome: OTA 只从可信配置构造下载地址，且设备、绑定码、请求头和令牌不进入日志
    verifier:
      type: command
      command: cd /home/luban/codebase/aiot/.worktrees/xiaozhi-server-v0.9.6-eval && docker run --rm --network none -v "$PWD/main/xiaozhi-server:/opt/xiaozhi-esp32-server" -v "$PWD/tests/fixtures/isolated-config.yaml:/opt/xiaozhi-esp32-server/data/.config.yaml:ro" -w /opt/xiaozhi-esp32-server --entrypoint python xiaozhi-server:0.9.6-candidate-20260814 -m unittest tests.test_huoshan_tts_security tests.test_doubao_tts_resilience tests.test_qwen3_asr_flash tests.test_ota_handler_security tests.test_sensitive_log_redaction tests.test_network_resource_safety tests.test_provider_canary_contract tests.test_doubao_stream_resilience
    environment: local
    required: true
    owner: agent
    evidence:
      - 27 unittest cases passed in the candidate dependency image with network disabled; includes OTA origin validation, fail-closed behavior, binding-code and sensitive-log redaction, socket cleanup, provider configuration contracts, Doubao ASR authorization-failure backoff, Qwen ASR event-loop isolation, Doubao TTS permanent-failure handling, dual-stream TTS metadata redaction/connection bounds and placeholder-key redaction
      - the Doubao provider no longer logs headers, initialization request parameters, raw response data or arbitrary exception causes; HTTP 403 diagnostics are reduced to the status code and retries back off from 1 to 30 seconds while the buffered audio remains bounded
      - Qwen3-ASR-Flash runs the synchronous DashScope call outside the asyncio event loop, uses a per-call API key and applies both SDK and coroutine request bounds without logging provider payloads or credentials
      - Doubao TTS applies a request timeout, treats HTTP 403 as non-retryable, retains bounded retry for transient failures and removes generated text, response bodies, file paths and arbitrary exception payloads from TTS failure logs
      - Huoshan dual-stream TTS applies WebSocket open/close bounds and keeps text, session ids, file paths, connection ids, server metadata and arbitrary exception payloads out of logs
      - shared model-key validation no longer echoes an empty, invalid or placeholder credential into provider logs
    status: pass
    last_verified_at: 2026-08-15T14:58:20+08:00
  - id: AC-03
    outcome: 本地镜像可构建，并在不连接现有数据库、不占用现有端口的隔离环境启动且通过 HTTP/WebSocket 探测
