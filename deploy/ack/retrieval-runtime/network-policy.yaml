apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xiaozhi-retrieval-runtime-ingress
  labels:
    app.kubernetes.io/name: xiaozhi-retrieval-runtime
    app.kubernetes.io/part-of: xiaozhi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: xiaozhi-retrieval-runtime
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: xiaozhi-esp32-server
      ports:
        - port: 8090
          protocol: TCP
