services:
  xiaozhi-esp32-server:
    image: ${XIAOZHI_SERVER_IMAGE:-ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest}
    volumes:
      - type: bind
        source: ${XIAOZHI_VAD_MODEL_PATH:?XIAOZHI_VAD_MODEL_PATH must point to silero_vad.onnx}
        target: /opt/xiaozhi-esp32-server/models/snakers4_silero-vad/src/silero_vad/data/silero_vad.onnx
        read_only: true
        bind:
          create_host_path: false
  xiaozhi-esp32-server-web:
    image: ${XIAOZHI_WEB_IMAGE:-ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:web_latest}
